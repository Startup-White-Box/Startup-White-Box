name: CI Self-Hosted Runner Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Linux, X64, startup-in-a-box]
    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        run: |
          echo "OS: $(uname -a)"
          echo "Node: $(node --version)"
          echo "Python: $(python3.12 --version 2>/dev/null || python3 --version)"
          echo "Git: $(git --version)"
          echo "Docker: $(docker --version)"
          echo "Runner: self-hosted - no time limits"

      - name: Test Redis
        run: docker exec sib-redis redis-cli ping

      - name: Test MinIO
        run: curl -sf http://localhost:9000/minio/health/live

      - name: Done
        run: echo "CI passed on self-hosted runner"
